<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sheri's Archipelago</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loader" class="loader">
    <div class="loader-copy">
      <div class="loader-title">Sheri's Archipelago</div>
      <div class="loader-sub">Entering the main island…</div>
      <div class="bar"><span></span></div>
    </div>
  </div>

  <main id="app">
    <canvas id="world"></canvas>

    <div class="hint-card">
      <strong>Main Island</strong>
      <span>Drag to look around · Scroll to zoom</span>
    </div>

    <div class="mode-card">
      Art-preserving 3D diorama
    </div>

    <button id="reset" type="button">Reset view</button>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
