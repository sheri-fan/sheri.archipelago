<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sheri Archipelago — 3D Art Prototype</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading" class="loading">
    <div class="loading-inner">
      <div class="loading-title">Sheri's Archipelago</div>
      <div class="loading-subtitle">A hand-painted world you can touch</div>
      <div class="loading-bar"><span></span></div>
    </div>
  </div>

  <main id="app">
    <canvas id="world"></canvas>

    <div class="hud top-left">
      <div class="title">Main Island</div>
      <div class="subtitle">Drag to rotate · Scroll to zoom · Right-drag to pan</div>
    </div>

    <div class="hud bottom-left">
      <div><b>Art prototype</b> · true 3D + painterly materials</div>
      <div class="small">Camera movement remains real 3D.</div>
    </div>

    <button id="resetCamera" class="reset" type="button">Reset view</button>
    <div id="label" class="label" hidden></div>
    <div id="toast" class="toast" hidden></div>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
